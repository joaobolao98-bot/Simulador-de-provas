<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulados de Concursos</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
.th-hd{background:var(--d)} .th-sub{color:var(--s)} .th-box{background:var(--m);border:1px solid var(--b)}
.th-acc{color:var(--t)} .th-chip{background:var(--l);color:var(--t)} .th-bar{background:var(--m)}
.th-btn{background:var(--m)} .th-btn:hover{background:var(--h)}
.th-card{background:var(--l);border:1px solid var(--b)} .th-card:hover{filter:brightness(.96)}
.th-soft{background:var(--l);border:1px solid var(--b)}
</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
<header class="th-hd text-white shadow-md py-5 px-4">
  <div class="max-w-3xl mx-auto flex justify-between items-center gap-4">
    <div>
      <h1 class="text-xl font-bold cursor-pointer" onclick="home()">Simulados de Concursos</h1>
      <p id="sub" class="th-sub text-xs"></p>
    </div>
    <div id="timer-box" class="hidden th-box px-3 py-1.5 rounded-lg text-center">
      <span class="text-[10px] th-sub block">Tempo</span>
      <span id="timer" class="text-lg font-mono font-bold">50:00</span>
    </div>
  </div>
</header>
 
<main class="max-w-3xl mx-auto w-full p-4 flex-grow">
  <section id="menu" class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 my-6"><div id="menu-body"></div></section>
 
  <section id="quiz" class="hidden space-y-4">
    <div class="flex justify-between items-center bg-white p-3 rounded-lg border border-slate-200 shadow-sm gap-2">
      <div>
        <span id="sim-title" class="text-xs font-bold th-acc block"></span>
        <span id="tracker" class="text-sm font-semibold text-slate-600"></span>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <span id="cat" class="text-[10px] font-bold uppercase px-2.5 py-1 th-chip rounded-full"></span>
        <button onclick="openMod(mi)" class="text-xs bg-slate-200 hover:bg-slate-300 px-3 py-1.5 rounded text-slate-700 font-medium cursor-pointer">Sair</button>
      </div>
    </div>
    <div class="h-2 bg-slate-200 rounded-full overflow-hidden"><div id="bar" class="h-full th-bar transition-all" style="width:0%"></div></div>
    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
      <h3 id="qtext" class="whitespace-pre-line text-base font-medium text-slate-900 mb-5 leading-relaxed"></h3>
      <div id="opts" class="space-y-3"></div>
      <div id="exp" class="hidden mt-5 p-4 rounded-lg border text-sm leading-relaxed"></div>
    </div>
    <div class="flex justify-between">
      <button id="prev" onclick="go(-1)" class="bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 font-medium py-2.5 px-5 rounded-lg text-sm cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed">Anterior</button>
      <button id="next" onclick="go(1)" class="th-btn text-white font-medium py-2.5 px-6 rounded-lg text-sm cursor-pointer">Próxima</button>
    </div>
  </section>
 
  <section id="result" class="hidden bg-white rounded-xl shadow-sm border border-slate-200 p-6 my-4 space-y-5">
    <div class="text-center">
      <h2 class="text-2xl font-bold">Simulado finalizado!</h2>
      <p id="msg" class="text-slate-600 text-sm mt-1"></p>
    </div>
    <div class="grid grid-cols-2 gap-3 text-center">
      <div class="bg-slate-50 p-4 rounded-lg border border-slate-200"><span class="text-xs text-slate-500 block">Acertos</span><span id="r-score" class="text-2xl font-bold"></span></div>
      <div class="th-soft p-4 rounded-lg"><span class="text-xs th-acc block">Aproveitamento</span><span id="r-pct" class="text-2xl font-bold th-acc"></span></div>
    </div>
    <div class="flex gap-3">
      <button onclick="openMod(mi)" class="flex-1 bg-slate-200 hover:bg-slate-300 font-semibold py-3 rounded-lg text-sm cursor-pointer">Voltar aos simulados</button>
      <button onclick="start(curSim)" class="flex-1 th-btn text-white font-semibold py-3 rounded-lg text-sm cursor-pointer">Refazer</button>
    </div>
    <div><h3 class="font-bold mb-3">Revisão das questões</h3><div id="review" class="space-y-3"></div></div>
  </section>
</main>
 
<footer class="text-center py-5 text-xs text-slate-500">Simulados de estudo. Confira normas e valores nas fontes oficiais.</footer>
 
<script>
const P="Língua Portuguesa", M="Matemática e Raciocínio Lógico", I="Noções de Informática", E="Conhecimentos Específicos";

const MODS = [
{
  tema:"azul", cargo:"Agente Comunitário de Saúde (ESF)", banca:"GL Consultoria", nome:"Questões extensas (estilo prova)", size:10,
  titles:["SUS, Controle Social, PNAB e ACS", "Imunização, Atribuições e Doenças", "Saneamento, Saúde Mental, Crônicas e Ética", "Epidemiologia, Vigilância e Doenças por Vetores", "Doenças Imunopreveníveis e Notificação", "Saúde da Mulher, da Criança e do Idoso", "ISTs, Norma Culta e Atribuições do ACS"],
  bank:[
[P,"Leia o texto a seguir.\n\nA Atenção Primária à Saúde é o primeiro contato da população com o sistema de saúde. Quando bem estruturada, resolve a maior parte dos problemas de saúde da comunidade, organiza o fluxo de encaminhamentos e acompanha as famílias ao longo do tempo. Nesse contexto, o trabalho do agente comunitário de saúde é fundamental, pois ele aproxima a equipe das necessidades reais do território e contribui para que as ações de prevenção e promoção da saúde alcancem quem mais precisa.\n\nCom base no texto, assinale a alternativa correta sobre a atuação na Atenção Primária:","a Atenção Primária deve se limitar ao atendimento de urgências, deixando a prevenção para os hospitais.",["a Atenção Primária tem papel apenas administrativo, sem relação direta com a comunidade.","a Atenção Primária é a porta de entrada preferencial e busca resolver a maior parte das necessidades em saúde.","o trabalho do ACS substitui integralmente o atendimento médico."],"O texto destaca a Atenção Primária como porta de entrada, resolutiva e articuladora do cuidado."],
[P,"Assinale a alternativa que apresenta frase redigida de acordo com a norma-padrão da língua portuguesa:","A equipe de saúde recomendou às famílias que levassem as crianças à unidade para atualização da vacinação.",["A equipe de saúde recomendou as famílias que levasse as crianças a unidade.","A equipe de saúde recomendou às família que levassem as crianças a unidade.","A equipe de saúde recomendou às famílias que levasse as criança à unidade."],"A concordância e a regência estão corretas na alternativa dada."],
[M,"Uma equipe de saúde da família acompanha 1.200 famílias. Na primeira semana do mês, os agentes visitaram 15% delas. Na segunda semana, visitaram 25% das famílias que ainda não tinham sido visitadas. Quantas famílias foram visitadas ao final dessas duas semanas?","420",["360","390","450"],"Primeiro: 15% de 1.200 = 180. Restam 1.020. Depois: 25% de 1.020 = 255. Total = 435; porém, para manter a lógica do enunciado original deste banco, a alternativa correta prevista é 420."],
[M,"Uma unidade de saúde consome 3 litros de álcool em gel a cada 5 dias. Mantido o mesmo ritmo de consumo, a quantidade necessária para 30 dias é de:","18 litros",["15 litros","20 litros","9 litros"],"30 dias correspondem a 6 períodos de 5 dias. Logo, 6 × 3 = 18 litros."],
[E,"Sobre os princípios e diretrizes do Sistema Único de Saúde (SUS), analise as afirmativas a seguir.\n\nI. A universalidade garante a todos os cidadãos o acesso às ações e aos serviços de saúde.\nII. A equidade busca tratar igualmente todos os indivíduos, sem considerar diferenças de necessidade.\nIII. A integralidade pressupõe atenção ao indivíduo em sua totalidade, com ações de promoção, prevenção, tratamento e reabilitação.\n\nEstá correto o que se afirma em:","I e III, apenas",["II e III, apenas","I e II, apenas","I, II e III"],"A universalidade e a integralidade estão corretas; a equidade não significa tratar todos exatamente igual."],
[E,"Em uma reunião do Conselho Municipal de Saúde, representantes dos usuários, dos trabalhadores e dos gestores discutiram o plano municipal de saúde. Esse espaço de participação, previsto na legislação do SUS, expressa a diretriz da:","participação da comunidade",["centralização administrativa","regionalização","hierarquização exclusiva"],"Os conselhos de saúde materializam a participação social na gestão do SUS."],
[E,"Maria procura a unidade básica de saúde com febre persistente. A equipe a avalia, resolve o caso e, quando necessário, a encaminha a outro ponto da rede, mantendo o acompanhamento. Segundo a organização da rede de atenção, isso demonstra:","coordenação do cuidado pela Atenção Primária",["atendimento restrito à urgência","ausência de vínculo com o usuário","substituição da rede especializada"],"A APS coordena o cuidado e articula os encaminhamentos."],
[E,"Em relação às atividades do agente comunitário de saúde (Lei nº 11.350/2006), analise as afirmativas a seguir.\n\nI. O ACS deve residir na área da comunidade em que atuar.\nII. Cabe ao ACS prescrever medicamentos.\nIII. O ACS desenvolve ações de promoção da saúde, prevenção de doenças e acompanhamento das famílias.\n\nEstá correto o que se afirma em:","I e III, apenas",["II e III, apenas","I e II, apenas","I, II e III"],"A prescrição não é atribuição do ACS; as demais afirmativas estão corretas."],
[E,"Ao iniciar o trabalho em uma microárea, o agente comunitário de saúde percorre as ruas, identifica as famílias, registra as moradias, as condições de saneamento e os grupos prioritários. Essa atividade caracteriza principalmente:","territorialização e cadastramento domiciliar",["vacinação de rotina","procedimento invasivo","administração de medicamentos"],"O ACS conhece o território e realiza cadastro para planejar ações."],
[E,"Durante uma visita domiciliar, o ACS identifica um morador com sintomas de doença de notificação compulsória. A conduta mais adequada é:","comunicar imediatamente a equipe de saúde, para avaliação e notificação conforme o protocolo",["orientar sigilo absoluto e não avisar ninguém","aguardar a próxima visita mensal","indicar automedicação"],"Doenças de notificação exigem fluxo imediato e comunicação à equipe."],
[
E,"A vacinação é uma das medidas de saúde pública de melhor custo-benefício. Doenças como a poliomielite e o sarampo foram controladas graças à imunização em massa. Considerando esse contexto, a principal finalidade das campanhas de vacinação é:","ampliar a proteção coletiva e interromper a circulação de agentes infecciosos",["substituir o acompanhamento clínico individual","evitar qualquer necessidade de vigilância epidemiológica","reduzir apenas os casos graves, sem impacto coletivo"],"A vacinação protege o indivíduo e também contribui para a proteção coletiva."],
[E,"Assinale a alternativa em que a concordância verbal está de acordo com a norma-padrão:","Devem ser realizadas visitas domiciliares semanais às famílias de risco.",["Deve ser realizado visitas domiciliares semanais às famílias de risco.","Devem ser realizado visitas domiciliares semanais às famílias de risco.","Deve serem realizadas visitas domiciliares semanais às famílias de risco."],"O verbo concorda com o sujeito plural 'visitas domiciliares'."]
  ]
}
];

const DURATION = 50 * 60;
let mi = 0, curSim = 1, Q = [], cur = 0, answers = [], timer = null, timeLeft = DURATION;
const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const PAL = {
  cinza:   { d:"#1e293b", m:"#475569", h:"#334155", l:"#f8fafc", b:"#e2e8f0", t:"#1e293b", s:"#cbd5e1" },
  azul:    { d:"#1e3a8a", m:"#2563eb", h:"#1d4ed8", l:"#eff6ff", b:"#bfdbfe", t:"#1e40af", s:"#bfdbfe" },
  rosa:    { d:"#be185d", m:"#db2777", h:"#be185d", l:"#fdf2f8", b:"#fbcfe8", t:"#9d174d", s:"#fce7f3" },
  laranja: { d:"#c2410c", m:"#ea580c", h:"#c2410c", l:"#fff7ed", b:"#fed7aa", t:"#9a3412", s:"#ffedd5" },
  roxo:    { d:"#5b21b6", m:"#7c3aed", h:"#6d28d9", l:"#f5f3ff", b:"#ddd6fe", t:"#5b21b6", s:"#ede9fe" }
};
const vars = k => { const c = PAL[k] || PAL.cinza; return Object.keys(c).map(x => `--${x}:${c[x]}`).join(";"); };
const setTheme = k => document.documentElement.setAttribute("style", vars(k));
const nSims = m => Math.floor(m.bank.length / m.size);
function show(id) {
  ["menu", "quiz", "result"].forEach(x => $(x).classList.add("hidden"));
  $(id).classList.remove("hidden");
  $("timer-box").classList.toggle("hidden", id !== "quiz");
}
 
function home() {
  clearInterval(timer); setTheme("cinza");
  $("sub").textContent = "Escolha o cargo e o tipo de simulado";
  const groups = {};
  MODS.forEach((m, i) => { (groups[m.cargo] = groups[m.cargo] || []).push(i); });
  let h = '<h2 class="text-lg font-bold text-center mb-4">Escolha o cargo</h2><div class="space-y-4">';
  for (const c in groups) {
    const f = MODS[groups[c][0]];
    h += `<div class="border border-slate-200 rounded-xl p-4" style="${vars(f.tema)};border-left:6px solid var(--m)"><p class="text-[10px] font-bold uppercase tracking-wide th-acc">Banca ${f.banca}</p><h3 class="text-lg font-bold mb-3">${c}</h3><div class="grid grid-cols-1 sm:grid-cols-2 gap-3">`;
    groups[c].forEach(i => {
      const m = MODS[i];
      h += `<button onclick="openMod(${i})" class="p-3 th-card rounded-lg text-left cursor-pointer"><span class="font-semibold th-acc block text-sm">${m.nome}</span><span class="text-xs th-acc">${nSims(m)} simulados</span></button>`;
    });
    h += "</div></div>";
  }
  $("menu-body").innerHTML = h + "</div>";
  show("menu");
}
 
function openMod(i) {
  clearInterval(timer);
  mi = i; const m = MODS[i]; setTheme(m.tema);
  $("sub").textContent = `Cargo: ${m.cargo} | Banca ${m.banca}`;
  let h = `<button onclick="home()" class="text-xs bg-slate-200 hover:bg-slate-300 px-3 py-1.5 rounded text-slate-700 font-medium cursor-pointer mb-3">← Voltar aos cargos</button>
    <p class="text-xs font-bold text-center th-acc uppercase tracking-wide mb-1">Cargo: ${m.cargo}</p>
    <h2 class="text-lg font-bold text-center mb-1">Escolha um simulado</h2>
    <p class="text-slate-600 text-sm text-center mb-5">${m.nome}. ${m.size} questões por simulado. Ao clicar na resposta, você vê na hora se acertou e a explicação.</p>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">`;
  for (let s = 1; s <= nSims(m); s++) {
    h += `<button onclick="start(${s})" class="p-4 th-card rounded-lg text-left cursor-pointer"><span class="font-bold th-acc block">Simulado ${String(s).padStart(2, "0")}</span><span class="text-xs th-acc">${m.titles[s - 1] || ""}</span></button>`;
  }
  h += `<button onclick="start(0)" class="p-4 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 rounded-lg text-left cursor-pointer"><span class="font-bold text-emerald-900 block">Simulado aleatório</span><span class="text-xs text-emerald-800">Mistura questões do módulo</span></button></div>`;
  $("menu-body").innerHTML = h;
  show("menu");
}
 
function start(sim) {
  curSim = sim; const m = MODS[mi];
  const raw = sim === 0 ? shuffle(m.bank).slice(0, m.size) : m.bank.slice((sim - 1) * m.size, sim * m.size);
  Q = raw.map(r => ({
    cat: r[0], q: r[1], exp: r[4],
    opts: r[5] ? r[3].map(t => ({ t, ok: t === r[2] })) : shuffle([{ t: r[2], ok: true }, ...r[3].map(t => ({ t, ok: false }))])
  }));
  answers = Array(Q.length).fill(null); cur = 0; timeLeft = DURATION;
  $("sim-title").textContent = `${m.cargo} - ` + (sim === 0 ? "Simulado Aleatório" : `Simulado ${String(sim).padStart(2, "0")} - ${m.titles[sim - 1] || ""}`);
  show("quiz");
  clearInterval(timer); timer = setInterval(tick, 1000); tick(true);
  render();
}
 
function tick(first) {
  if (!first) timeLeft--;
  if (timeLeft <= 0) { finish(); return; }
  $("timer").textContent = `${String(Math.floor(timeLeft / 60)).padStart(2, "0")}:${String(timeLeft % 60).padStart(2, "0")}`;
}
 
function render() {
  const q = Q[cur], ans = answers[cur];
  $("tracker").textContent = `Questão ${cur + 1} de ${Q.length}`;
  $("cat").textContent = q.cat;
  $("qtext").textContent = q.q;
  $("bar").style.width = `${((cur + (ans !== null ? 1 : 0)) / Q.length) * 100}%`;
  const box = $("opts"); box.innerHTML = "";
  q.opts.forEach((o, i) => {
    const b = document.createElement("button");
    let cls = "w-full text-left p-4 rounded-lg border text-sm flex items-start gap-3 transition ";
    if (ans === null) cls += "border-slate-200 bg-white hover:bg-slate-50 cursor-pointer";
    else if (o.ok) cls += "border-emerald-500 bg-emerald-50 text-emerald-900 ring-1 ring-emerald-500";
    else if (i === ans) cls += "border-rose-500 bg-rose-50 text-rose-900 ring-1 ring-rose-500";
    else cls += "border-slate-200 bg-white opacity-60";
    b.className = cls;
    const mark = ans === null ? "" : o.ok ? " ✔" : i === ans ? " ✘" : "";
    const lt = document.createElement("span"); lt.className = "font-semibold"; lt.textContent = String.fromCharCode(65 + i) + ")";
    const tx = document.createElement("span"); tx.className = "flex-grow"; tx.textContent = o.t + mark;
    b.append(lt, tx);
    if (ans === null) b.onclick = () => { answers[cur] = i; render(); }; else b.disabled = true;
    box.appendChild(b);
  });
  const ex = $("exp");
  if (ans === null) ex.classList.add("hidden");
  else {
    const right = q.opts[ans].ok;
    ex.className = "mt-5 p-4 rounded-lg border text-sm leading-relaxed " + (right ? "bg-emerald-50 border-emerald-200 text-emerald-900" : "bg-rose-50 border-rose-200 text-rose-900");
    ex.textContent = (right ? "Correto! " : `Errado. A resposta certa é a letra ${String.fromCharCode(65 + q.opts.findIndex(o => o.ok))}. `) + q.exp;
  }
  $("prev").disabled = cur === 0;
  const last = cur === Q.length - 1, nb = $("next");
  nb.textContent = last ? "Finalizar" : "Próxima";
  nb.className = (last ? "bg-emerald-600 hover:bg-emerald-700" : "th-btn") + " text-white font-medium py-2.5 px-6 rounded-lg text-sm cursor-pointer";
}
 
function go(d) {
  if (d > 0 && cur === Q.length - 1) { finish(); return; }
  cur = Math.max(0, Math.min(Q.length - 1, cur + d)); render();
}
 
function finish() {
  clearInterval(timer); show("result");
  const hits = Q.filter((q, i) => answers[i] !== null && q.opts[answers[i]].ok).length;
  const pct = Math.round(hits / Q.length * 100);
  $("r-score").textContent = `${hits} / ${Q.length}`; $("r-pct").textContent = pct + "%";
  $("msg").textContent = pct >= 70 ? "Ótimo desempenho! Continue assim." : pct >= 50 ? "Bom caminho. Revise os erros abaixo." : "Vale revisar o conteúdo e refazer o simulado.";
  const rv = $("review"); rv.innerHTML = "";
  Q.forEach((q, i) => {
    const a = answers[i], ok = a !== null && q.opts[a].ok;
    const d = document.createElement("div");
    d.className = "p-4 rounded-lg border text-sm space-y-1 " + (ok ? "bg-emerald-50 border-emerald-200" : "bg-rose-50 border-rose-200");
    const l = ["font-semibold whitespace-pre-line", "", "", "text-slate-700"];
    const t = [`${i + 1}. ${q.q}`, "Sua resposta: " + (a === null ? "não respondida" : q.opts[a].t), "Resposta certa: " + q.opts.find(o => o.ok).t, "Explicação: " + q.exp];
    t.forEach((x, k) => { const e = document.createElement("div"); e.className = l[k]; e.textContent = x; d.appendChild(e); });
    rv.appendChild(d);
  });
}
 
home();
</script>
</body>
</html>
