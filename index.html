<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulados de Concursos</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
.th-hd{background:var(--d)} .th-sub{color:var(--s)} .th-box{background:var(--m);border:1px solid var(--b)}
.th-acc{color:var(--t)} .th-chip{background:var(--l);color:var(--t)} .th-bar{background:var(--m)}
.th-btn{background:var(--m)} .th-btn:hover{background:var(--h)}
.th-card{background:var(--l);border:1px solid var(--b)} .th-card:hover{filter:brightness(.96)}
.th-soft{background:var(--l);border:1px solid var(--b)}
</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
<header class="th-hd text-white shadow-md py-5 px-4">
  <div class="max-w-3xl mx-auto flex justify-between items-center gap-4">
    <div>
      <h1 class="text-xl font-bold cursor-pointer" onclick="home()">Simulados de Concursos</h1>
      <p id="sub" class="th-sub text-xs"></p>
    </div>
    <div id="timer-box" class="hidden th-box px-3 py-1.5 rounded-lg text-center">
      <span class="text-[10px] th-sub block">Tempo</span>
      <span id="timer" class="text-lg font-mono font-bold">50:00</span>
    </div>
  </div>
</header>
 
<main class="max-w-3xl mx-auto w-full p-4 flex-grow">
  <section id="menu" class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 my-6"><div id="menu-body"></div></section>
 
  <section id="quiz" class="hidden space-y-4">
    <div class="flex justify-between items-center bg-white p-3 rounded-lg border border-slate-200 shadow-sm gap-2">
      <div>
        <span id="sim-title" class="text-xs font-bold th-acc block"></span>
        <span id="tracker" class="text-sm font-semibold text-slate-600"></span>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <span id="cat" class="text-[10px] font-bold uppercase px-2.5 py-1 th-chip rounded-full"></span>
        <button onclick="openMod(mi)" class="text-xs bg-slate-200 hover:bg-slate-300 px-3 py-1.5 rounded text-slate-700 font-medium cursor-pointer">Sair</button>
      </div>
    </div>
    <div class="h-2 bg-slate-200 rounded-full overflow-hidden"><div id="bar" class="h-full th-bar transition-all" style="width:0%"></div></div>
    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
      <h3 id="qtext" class="whitespace-pre-line text-base font-medium text-slate-900 mb-5 leading-relaxed"></h3>
      <div id="opts" class="space-y-3"></div>
      <div id="exp" class="hidden mt-5 p-4 rounded-lg border text-sm leading-relaxed"></div>
    </div>
    <div class="flex justify-between">
      <button id="prev" onclick="go(-1)" class="bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 font-medium py-2.5 px-5 rounded-lg text-sm cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed">Anterior</button>
      <button id="next" onclick="go(1)" class="th-btn text-white font-medium py-2.5 px-6 rounded-lg text-sm cursor-pointer">Próxima</button>
    </div>
  </section>
 
  <section id="result" class="hidden bg-white rounded-xl shadow-sm border border-slate-200 p-6 my-4 space-y-5">
    <div class="text-center">
      <h2 class="text-2xl font-bold">Simulado finalizado!</h2>
      <p id="msg" class="text-slate-600 text-sm mt-1"></p>
    </div>
    <div class="grid grid-cols-2 gap-3 text-center">
      <div class="bg-slate-50 p-4 rounded-lg border border-slate-200"><span class="text-xs text-slate-500 block">Acertos</span><span id="r-score" class="text-2xl font-bold"></span></div>
      <div class="th-soft p-4 rounded-lg"><span class="text-xs th-acc block">Aproveitamento</span><span id="r-pct" class="text-2xl font-bold th-acc"></span></div>
    </div>
    <div class="flex gap-3">
      <button onclick="openMod(mi)" class="flex-1 bg-slate-200 hover:bg-slate-300 font-semibold py-3 rounded-lg text-sm cursor-pointer">Voltar aos simulados</button>
      <button onclick="start(curSim)" class="flex-1 th-btn text-white font-semibold py-3 rounded-lg text-sm cursor-pointer">Refazer</button>
    </div>
    <div><h3 class="font-bold mb-3">Revisão das questões</h3><div id="review" class="space-y-3"></div></div>
  </section>
</main>
 
<footer class="text-center py-5 text-xs text-slate-500">Simulados de estudo. Confira normas e valores nas fontes oficiais.</footer>
 
<script>
const P="Língua Portuguesa", M="Matemática e Raciocínio Lógico", I="Noções de Informática", E="Conhecimentos Específicos";
 
const MODS = [
{
  tema:"azul", cargo:"Agente Administrativo / Técnico", banca:"Banca Examinadora", nome:"Questões extensas (estilo prova)", size:10,
  titles:["Simulado 01", "Simulado 02", "Simulado 03", "Simulado 04", "Simulado 05", "Simulado 06", "Simulado 07", "Simulado 08", "Simulado 09", "Simulado 10", "Simulado 11", "Simulado 12", "Simulado 13", "Simulado 14", "Simulado 15", "Simulado 16"],
  bank:[
    // ---- Simulado 01
    [
      [P,"Leia o texto a seguir.\n\nA Atenção Primária à Saúde é o primeiro contato da população com o sistema de saúde. Quando bem estruturada, resolve a maior parte dos problemas da comunidade, evita internações desnecessárias e reduz custos. Nesse cenário, o agente comunitário de saúde, por viver na própria comunidade, funciona como elo entre as famílias e a equipe, levando informações em ambas as direções.\n\nCom base no texto, é correto afirmar que o agente comunitário de saúde:","contribui para que as informações circulem entre as famílias e a equipe de saúde.",["substitui os demais profissionais da equipe de saúde.","atua exclusivamente em ambiente hospitalar.","é o responsável pela decisão sobre as internações."],"O texto o descreve como 'elo' que leva informações nos dois sentidos."],
      [P,"Assinale a alternativa que apresenta frase redigida de acordo com a norma-padrão da língua portuguesa:","A equipe de saúde recomendou às famílias que levassem as crianças à unidade para vacinação.",["A equipe de saúde recomendou as famílias que levassem as crianças a unidade para vacinação.","A equipe de saúde recomendou à famílias que levassem as crianças à unidade para vacinação.","A equipe de saúde recomendou às famílias que levassem as crianças à unidade à partir de segunda."],"'Às famílias' e 'à unidade' levam crase (preposição + artigo). Não há crase antes de 'partir' nem antes de plural sem artigo."],
      [M,"Uma equipe de saúde da família acompanha 1.200 famílias. Na primeira semana do mês, os agentes visitaram 15% delas. Na segunda semana, visitaram 25% das famílias que ainda não tinham sido visitadas. Ao final das duas semanas, o total de famílias visitadas foi de:","435",["300","480","375"],"15% de 1.200 = 180. Restam 1.020; 25% de 1.020 = 255. Total: 180 + 255 = 435."],
      [M,"Uma unidade de saúde consome 3 litros de álcool em gel a cada 5 dias. Mantido o mesmo ritmo de consumo, a quantidade necessária para 30 dias é de:","18 litros",["15 litros","20 litros","9 litros"],"30 dias equivalem a 6 períodos de 5 dias; 6 × 3 = 18 litros."],
      [E,"Sobre os princípios e diretrizes do Sistema Único de Saúde (SUS), analise as afirmativas a seguir.\n\nI. A universalidade garante a todos os cidadãos o acesso às ações e aos serviços de saúde.\nII. A equidade propõe tratar todas as pessoas de forma idêntica, sem considerar as diferenças de necessidade.\nIII. A participação da comunidade na gestão do SUS é exercida por meio dos Conselhos e das Conferências de Saúde.\n\nEstá(ão) correta(s):","Apenas I e III.",["Apenas I.","Apenas II.","Apenas I e III.","I, II e III."],"A equidade trata de forma desigual os desiguais, priorizando quem mais precisa; por isso a afirmativa II é falsa."],
      [E,"Em uma reunião do Conselho Municipal de Saúde, representantes dos usuários, dos trabalhadores e dos gestores discutiram o plano municipal de saúde. Esse espaço de participação, previsto na Lei nº 8.142/1990, caracteriza-se por ser:","permanente e deliberativo, com os usuários representando metade dos membros.",["temporário e apenas consultivo, sem poder de decisão.","exclusivo de gestores e prestadores de serviço.","privado e dependente de autorização judicial."],"O Conselho de Saúde é órgão colegiado permanente e deliberativo, com composição paritária (50% de usuários)."],
      [E,"Maria procura a unidade básica de saúde com febre persistente. A equipe a avalia, resolve o caso e, quando necessário, a encaminha a outro ponto da rede, mantendo o acompanhamento. Segundo a PNAB (Portaria nº 2.436/2017), esse exemplo ilustra a função de:","coordenar o cuidado e ordenar a rede de atenção à saúde.",["atender apenas casos de urgência hospitalar.","oferecer cuidado fragmentado, sem vínculo com o usuário.","substituir os demais pontos da rede de atenção."],"A APS é a porta de entrada preferencial, coordena o cuidado e ordena o acesso à rede."],
      [E,"Em relação às atividades do agente comunitário de saúde (Lei nº 11.350/2006), analise as afirmativas a seguir.\n\nI. O ACS deve residir na área da comunidade em que atuar.\nII. Cabe ao ACS prescrever medicamentos aos moradores da microárea.\nIII. O ACS realiza visitas domiciliares e orienta sobre a prevenção de doenças e a promoção da saúde.\n\nEstá(ão) correta(s):","Apenas I e III.",["Apenas I.","Apenas II e III.","Apenas I e III.","I, II e III."],"Prescrever medicamentos não é atribuição do ACS; a afirmativa II é falsa."],
      [E,"Ao iniciar o trabalho em uma microárea, o agente comunitário de saúde percorre as ruas, identifica as famílias, registra as moradias, as condições de saneamento e os grupos prioritários. Essa atividade corresponde, principalmente, ao:","cadastramento das famílias e ao mapeamento do território.",["tratamento clínico das doenças identificadas.","procedimento de aplicação de vacinas.","processo de emissão de atestados médicos."],"O cadastro e o mapeamento orientam o planejamento das ações da equipe."],
      [E,"Durante uma visita domiciliar, o ACS identifica um morador com sintomas de doença de notificação compulsória. A conduta mais adequada é:","comunicar imediatamente a equipe de saúde, para que a notificação e as medidas de vigilância sejam realizadas.",["aguardar que o morador procure a unidade por conta própria.","orientar que ele não procure atendimento para evitar exames.","divulgar o caso entre os vizinhos para alertar a comunidade."],"A notificação é obrigatória e permite à vigilância agir rapidamente, respeitando o sigilo."]
    ],

    // ---- Simulado 02
    [
      [P,"Considerando o contexto institucional e a norma-padrão da Língua Portuguesa, leia o enunciado a seguir.\n\nDurante a rotina de atendimento ao público em uma repartição pública, constatou-se a necessidade de orientar adequadamente os usuários quanto à correta aplicação do sinal indicativo de crase nas comunicações internas e externas.\n\nAssinale a alternativa em que o emprego da crase obedece rigorosamente às normas gramaticais vigentes:","Entreguei o relatório à diretora.",["Fui à pé até o CRAS.","Refiro-me à todos os usuários.","O técnico começou à trabalhar cedo."],"'À diretora' = preposição a + artigo a. Não há crase antes de palavra masculina, pronome indefinido plural ou verbo."],
      [P,"Em uma análise sintática aprofundada de documentos administrativos, avalie o fragmento abaixo:\n\n'O técnico entregou o relatório à coordenadora responsável pelo setor.'\n\nA função sintática desempenhada especificamente pelo termo destacado ('à coordenadora') corresponde a:","Objeto indireto",["Objeto direto","Sujeito","Adjunto adnominal"],"Complementa o verbo 'entregar' por meio de preposição (a), exigida pela regência verbal, constituindo objeto indireto."],
      [M,"Em um levantamento estatístico realizado no departamento de assistência social, apurou-se que o quantitativo de servidores técnicos lotados no setor é de 15, enquanto o número de servidores administrativos totaliza 25.\n\nNessas condições, a razão matemática entre o número de técnicos e o de administrativos, devidamente simplificada, é representada por:","3/5",["5/3","2/3","1/2"],"15/25 simplificado por 5 resulta em 3/5."],
      [M,"Para a elaboração de um dossiê técnico prioritário, o cronograma estabeleceu que 4 servidores dedicados conseguem finalizar certa quantidade de relatórios em um prazo exato de 2 dias de trabalho contínuo.\n\nConsiderando a mesma proporção de produtividade, quanto tempo 3 servidores com o mesmo ritmo levarão para elaborar a idêntica quantidade de relatórios?","2 dias e 16 horas (≈ 2,67 dias)",["2 dias","3 dias","4 dias"],"Grandezas inversamente proporcionais: 4 × 2 = 3 × x, logo x = 8/3 ≈ 2,67 dias."],
      [I,"Durante uma auditoria de segurança da informação em uma rede corporativa, a equipe técnica identificou um programa malicioso que se disfarçava de utilitário legítimo para ludibriar o usuário, abrindo brechas de segurança no sistema operacional.\n\nEssa ameaça específica é amplamente conhecida como:","Cavalo de Troia (Trojan)",["Worm","Firewall","Cookie"],"O Trojan parece útil, mas esconde código malicioso. O worm propaga-se sozinho e o firewall é mecanismo de defesa."],
      [I,"No contexto da navegação segura na rede mundial de computadores, os protocolos de comunicação desempenham papel fundamental na proteção dos dados transmitidos entre o navegador e o servidor web.\n\nO protocolo de navegação que utiliza uma camada adicional de criptografia baseada em SSL/TLS é o:","HTTPS",["HTTP","FTP","SMTP"],"HTTPS é a versão segura do HTTP, empregando criptografia para proteger os dados em trânsito."],
      [E,"À luz das diretrizes e princípios fundamentais estabelecidos pelo Estatuto da Criança e do Adolescente (ECA - Lei nº 8.069/1990), analise a aplicação do princípio da proteção integral.\n\nO princípio da prioridade absoluta assegura, entre outros aspectos:": "Precedência de atendimento, primazia na proteção e destinação privilegiada de recursos públicos",["Isenção de responsabilidade por atos infracionais","Direito ao voto obrigatório aos 12 anos","Tratamento igual sem distinção de idade"],"Está no art. 4º do ECA: crianças e adolescentes têm prioridade absoluta na efetivação de seus direitos fundamentais."],
      [E,"O Conselho Tutelar constitui órgão essencial de proteção aos direitos da infância e da juventude nos municípios brasileiros.\n\nDe acordo com as disposições expressas no Estatuto da Criança e do Adolescente, o Conselho Tutelar caracteriza-se como um órgão:","Permanente, autônomo e não jurisdicional, que zela pelos direitos da criança e do adolescente",["Do Poder Judiciário, que aplica medidas socioeducativas","Temporário, vinculado ao Ministério Público","Privado, mantido por doações da sociedade civil"],"Art. 131 do ECA. O Conselho Tutelar não possui função jurisdicional: aplica medidas protetivas e encaminha os casos."],
      [E,"Para fins de aplicação das normas protetivas e garantias legais previstas no ordenamento jurídico brasileiro voltado à infância,\n\nPara o ECA, é considerada criança a pessoa de até:","12 anos incompletos",["10 anos completos","14 anos","16 anos"],"Criança: até 12 anos incompletos (ou seja, 11 anos, 11 meses e 29 dias). Adolescente: de 12 a 18 anos."],
      [E,"No exercício das atribuições profissionais em unidades de atendimento socioassistencial, o servidor depara-se frequentemente com situações de vulnerabilidade extrema e indícios de violações de direitos.\n\nDiante de uma situação confirmada ou sob suspeita de violência ou negligência contra criança ou idoso, a conduta técnica adequada é:","Acionar a rede de proteção e os órgãos competentes (Conselho Tutelar, CREAS etc.)",["Omitir para preservar a privacidade da família","Resolver de forma privada, sem registro formal","Aguardar o agravamento da situação para intervir"],"Há dever legal e ético de notificar e proteger. A omissão pode configurar infração ética e legal grave."]
    ],

    // ---- Simulado 03
    [
      [P,"Complete a lacuna na frase interrogativa indireta a seguir de acordo com a norma-padrão:\n\n'Não sei ___ o benefício assistencial foi negado pelo sistema.'\n\nA alternativa que preenche corretamente a lacuna é:","por que",["porque","porquê","por quê"],"Em interrogativa indireta no interior da oração, emprega-se 'por que' separado e sem acento."],
      [P,"Dada a frase: 'O benefício foi concedido porque preenchia os requisitos legais.', analise as propostas de reescrita.\n\nAssinale a alternativa cuja reescrita ALTERA o sentido lógico original estabelecido no período:","O benefício foi concedido, contudo preenchia os requisitos.",["O benefício foi concedido já que preenchia os requisitos.","O benefício foi concedido visto que preenchia os requisitos.","O benefício foi concedido pois preenchia os requisitos."],"'Contudo' introduz ideia de oposição (adversativa). As demais alternativas mantêm a relação de causa."],
      [M,"Durante a vistoria de uma nova instalação pública, constatou-se que a sala principal possui formato perfeitamente quadrado, com 8 metros de comprimento em cada um de seus lados.\n\nA área total útil dessa sala é de:","64 m²",["32 m²","16 m²","48 m²"],"Área do quadrado = lado × lado = 8m × 8m = 64 m²."],
      [M,"Um servidor público obteve as seguintes notas em quatro módulos avaliativos de seu treinamento de capacitação: 7, 8, 9 e 10.\n\nA média aritmética simples obtida pelo servidor nestas avaliações é igual a:","8,5",["8","9","9,5"],"Soma total = 34; dividindo por 4 avaliações, obtém-se 34 ÷ 4 = 8,5."],
      [I,"Durante a edição de um documento oficial no Microsoft Word, o operador necessita utilizar ferramentas voltadas à verificação ortográfica, contagem de palavras e controle de alterações.\n\nEssas ferramentas estão centralizadas na guia:","Revisão",["Página Inicial","Inserir","Exibição"],"A guia Revisão do Word concentra ortografia, dicionário de sinônimos, comentários e controle de alterações."],
      [I,"Como medida preventiva de segurança da informação e preservação contra perda acidental de dados corporativos, realiza-se rotineiramente a salvaguarda de arquivos em mídias externas ou nuvem.\n\nEsse procedimento preventivo é amplamente conhecido como:","Backup",["Cache","Spam","Phishing"],"Backup é a cópia de segurança dos dados. Cache é memória temporária e spam refere-se a mensagens indesejadas."],
      [E,"A Lei Orgânica da Assistência Social (LOAS - Lei nº 8.742/1993) regulamenta a organização da assistência social no Brasil, prevendo provisões suplementares e temporárias para o enfrentamento de contingências sociais.\n\nOs benefícios eventuais da assistência social atendem necessidades decorrentes de:","Nascimento, morte, vulnerabilidade temporária e calamidade pública",["Investimentos empresariais","Campanhas eleitorais municipais","Compra de veículos particulares"],"Previstos no art. 22 da LOAS, os benefícios eventuais cobrem contingências de nascimento, morte, vulnerabilidade e calamidade."],
      [E,"O Benefício de Prestação Continuada (BPC) constitui uma das principais garantias de proteção social não contributiva prevista na ordem constitucional brasileira.\n\nO BPC consiste no pagamento de:","Um salário mínimo mensal ao idoso (65 anos ou mais) e à pessoa com deficiência de baixa renda",["Aposentadoria rural gerida por sindicatos","Auxílio funeral pago exclusivamente pelo município","Bolsa de estudos federal para ensino superior"],"É benefício assistencial individual, não contributivo, garantido pelo art. 203 da CF e regulamentado pela LOAS."],
      [E,"A gestão integrada de programas sociais no âmbito federal, estadual e municipal exige instrumentos padronizados de mapeamento da população-alvo.\n\nO Cadastro Único (CadÚnico) é definido como:","Instrumento de identificação e caracterização socioeconômica das famílias de baixa renda",["Sistema exclusivo de aposentadorias do INSS","Cadastro unificado de eleitores da Justiça Eleitoral","Registro imobiliário de propriedades municipais"],"O CadÚnico é o principal instrumento do Estado brasileiro para inclusão e gestão de políticas sociais."],
      [E,"No contexto da organização do Sistema Único de Assistência Social (SUAS), os benefícios, serviços e programas distribuem-se conforme os níveis de proteção social.\n\nO BPC integra, no âmbito do SUAS, a:","Proteção Social Básica",["Proteção Social Especial de Alta Complexidade","Previdência Social contributiva","Rede privada de saúde suplementar"],"O BPC integra as proteções ofertadas no âmbito do SUAS, compondo a base de garantia de renda aos vulneráveis."]
    ],

    // ---- Simulado 04
    [
      [P,"Analise a concordância nominal e verbal nas frases redigidas para um memorando interno e assinale a alternativa correta:\n\n'A técnica estava meio preocupada com o caso.'","A técnica estava meio preocupada com o caso.",["A técnica estava meia preocupada com o caso.","Seguem anexo as fichas cadastrais.","Eles mesmo atenderam as famílias."],"'Meio' funcionando como advérbio (= um pouco) é invariável. 'Anexo' concorda com o substantivo e 'mesmo' também."],
      [P,"Dentre as regras ortográficas que regem a escrita culta da língua portuguesa, assinale a palavra grafada de maneira rigorosamente correta:","exceção",["excessão","exessão","esceção"],"'Exceção' deriva de 'excetuar'; grafa-se corretamente com 'xc' e 'ç'."],
      [M,"Em uma equação algébrica utilizada no planejamento orçamentário de um projeto, determinou-se a igualdade: 5x - 10 = 2x + 20.\n\nO valor da incógnita x que satisfaz essa equação é:","10",["5","15","20"],"Passando os termos com x para o primeiro membro: 5x - 2x = 20 + 10 => 3x = 30 => x = 10."],
      [M,"Um servidor público que percebe um vencimento bruto de R$ 2.000,00 sofre um desconto previdenciário obrigatório fixado em 11% sobre o valor.\n\nO montante correspondente ao salário líquido após a efetivação desse desconto é de:","R$ 1.780,00",["R$ 1.890,00","R$ 1.800,00","R$ 1.680,00"],"11% de 2.000 = 220; 2.000 - 220 = 1.780."],
      [I,"Nas fraudes virtuais modernas, é comum o uso de engenharia social associada a mensagens eletrônicas falsas que simulam instituições financeiras ou órgãos públicos para capturar senhas.\n\nEssa prática maliciosa é denominada:","Phishing",["Backup","Firewall","Cookie"],"Phishing é a técnica de roubo de identidade e dados confidenciais por meio de mensagens fraudulentas."],
      [I,"No ambiente operacional Microsoft Windows, atalhos de teclado agilizam operações cotidianas de edição de texto e gerenciamento de arquivos.\n\nO atalho de teclado padrão 'Ctrl + C' tem por finalidade principal:","Copiar",["Colar","Recortar","Desfazer"],"Ctrl + C copia o item selecionado para a área de transferência."],
      [E,"A Lei Geral de Proteção de Dados (LGPD - Lei nº 13.709/2018) impõe diretrizes severas para o tratamento de informações pessoais por órgãos públicos e privados.\n\nNo atendimento socioassistencial, a aplicação da LGPD exige:","Sigilo profissional e proteção e segurança dos dados pessoais e sensíveis dos usuários",["Divulgação irrestrita de prontuários em murais públicos","Destruição imediata de fichas de atendimento no mesmo dia","Compartilhamento automatizado de dados com redes sociais"],"Dados de usuários são protegidos por rigoroso sigilo e normas de segurança da LGPD."],
      [E,"A LGPD estabelece distinções jurídicas rigorosas quanto às categorias de dados coletados, conferindo proteção reforçada a determinadas informações de caráter íntimo.\n\nSão considerados exemplos de dados pessoais sensíveis segundo a LGPD:","Origem racial ou étnica, convicção religiosa e dado referente à saúde",["Apenas nome completo e endereço comercial","Somente informações cadastrais de empresas","Dados publicados em diários oficiais da união"],"O art. 5º da LGPD elenca expressamente os dados sensíveis, que demandam salvaguardas adicionais."],
