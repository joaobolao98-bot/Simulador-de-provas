<style>
.th-hd{background:var(--d)} .th-sub{color:var(--s)} .th-box{background:var(--m);border:1px solid var(--b)}
.th-acc{color:var(--t)} .th-chip{background:var(--l);color:var(--t)} .th-bar{background:var(--m)}
.th-btn{background:var(--m)} .th-btn:hover{background:var(--h)}
.th-card{background:var(--l);border:1px solid var(--b)} .th-card:hover{filter:brightness(.96)}

<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
<header class="th-hd text-white shadow-md py-5 px-4">
  <div class="max-w-3xl mx-auto flex justify-between items-center gap-4">
    <div>
      <h1 class="text-xl font-bold cursor-pointer" onclick="home()">Simulados de Concursos</h1>
      <p id="sub" class="th-sub text-xs"></p>
    </div>
    <div id="timer-box" class="hidden th-box px-3 py-1.5 rounded-lg text-center">
      <span class="text-[10px] th-sub block">Tempo</span>
      <span id="timer" class="text-lg font-mono font-bold">50:00</span>
    </div>
  </div>
</header>
 
<main class="max-w-3xl mx-auto w-full p-4 flex-grow">
  <section id="menu" class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 my-6"><div id="menu-body"></div></section>
 
  <section id="quiz" class="hidden space-y-4">
    <div class="flex justify-between items-center bg-white p-3 rounded-lg border border-slate-200 shadow-sm gap-2">
      <div>
        <span id="sim-title" class="text-xs font-bold th-acc block"></span>
        <span id="tracker" class="text-sm font-semibold text-slate-600"></span>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <span id="cat" class="text-[10px] font-bold uppercase px-2.5 py-1 th-chip rounded-full"></span>
        <button onclick="openMod(mi)" class="text-xs bg-slate-200 hover:bg-slate-300 px-3 py-1.5 rounded text-slate-700 font-medium cursor-pointer">Sair</button>
      </div>
    </div>
    <div class="h-2 bg-slate-200 rounded-full overflow-hidden"><div id="bar" class="h-full th-bar transition-all" style="width:0%"></div></div>
    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
      <h3 id="qtext" class="whitespace-pre-line text-base font-medium text-slate-900 mb-5 leading-relaxed"></h3>
      <div id="opts" class="space-y-3"></div>
      <div id="exp" class="hidden mt-5 p-4 rounded-lg border text-sm leading-relaxed"></div>
    </div>
    <div class="flex justify-between">
      <button id="prev" onclick="go(-1)" class="bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 font-medium py-2.5 px-5 rounded-lg text-sm cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed">Anterior</button>
      <button id="next" onclick="go(1)" class="th-btn text-white font-medium py-2.5 px-6 rounded-lg text-sm cursor-pointer">Próxima</button>
    </div>
  </section>
 
  <section id="result" class="hidden bg-white rounded-xl shadow-sm border border-slate-200 p-6 my-4 space-y-5">
    <div class="text-center">
      <h2 class="text-2xl font-bold">Simulado finalizado!</h2>
      <p id="msg" class="text-slate-600 text-sm mt-1"></p>
    </div>
    <div class="grid grid-cols-2 gap-3 text-center">
      <div class="bg-slate-50 p-4 rounded-lg border border-slate-200"><span class="text-xs text-slate-500 block">Acertos</span><span id="r-score" class="text-2xl font-bold"></span></div>
      <div class="th-soft p-4 rounded-lg"><span class="text-xs th-acc block">Aproveitamento</span><span id="r-pct" class="text-2xl font-bold th-acc"></span></div>
    </div>
    <div class="flex gap-3">
      <button onclick="openMod(mi)" class="flex-1 bg-slate-200 hover:bg-slate-300 font-semibold py-3 rounded-lg text-sm cursor-pointer">Voltar aos simulados</button>
      <button onclick="start(curSim)" class="flex-1 th-btn text-white font-semibold py-3 rounded-lg text-sm cursor-pointer">Refazer</button>
    </div>
    <div><h3 class="font-bold mb-3">Revisão das questões</h3><div id="review" class="space-y-3"></div></div>
  </section>
</main>
 
<footer class="text-center py-5 text-xs text-slate-500">Simulados de estudo. Confira normas e valores nas fontes oficiais.</footer>
 
<script>
const P="Língua Portuguesa", M="Matemática e Raciocínio Lógico", I="Noções de Informática", E="Conhecimentos Específicos";
 
// ===== DADOS: cada módulo = cargo + banca + tipo de questões. Cada 'size' questões seguidas formam 1 simulado. =====
const MODS = [
{
  tema:"azul", cargo:"Agente Comunitário de Saúde (ESF)", banca:"GL Consultoria", nome:"Questões extensas (estilo prova)", size:10,
  titles:["SUS, Controle Social, PNAB e ACS", "Imunização, Atribuições e Doenças", "Saneamento, Saúde Mental, Crônicas e Ética", "Epidemiologia, Vigilância e Doenças por Vetores", "Doenças Infecciosas e Imunização", "Saúde da Mulher, Criança e Idoso, ISTs e Normas do ACS"],
  bank:[
// ---- Simulado 01: SUS, controle social, PNAB e ACS
[P,"Leia o texto a seguir.\n\nA Atenção Primária à Saúde é o primeiro contato da população com o sistema de saúde. Quando bem estruturada, resolve a maior parte dos problemas de saúde da comunidade, evita internações desnecessárias e reduz custos. Nesse cenário, o agente comunitário de saúde, por viver na própria comunidade, funciona como elo entre as famílias e a equipe, levando informações em ambas as direções.\n\nCom base no texto, é correto afirmar que o agente comunitário de saúde:","contribui para que as informações circulem entre as famílias e a equipe de saúde.",["substitui os demais profissionais da equipe de saúde.","atua exclusivamente em ambiente hospitalar.","é o responsável pela decisão sobre as internações."],"O texto o descreve como 'elo' que leva informações nos dois sentidos."],
[P,"Assinale a alternativa que apresenta frase redigida de acordo com a norma-padrão da língua portuguesa:","A equipe de saúde recomendou às famílias que levassem as crianças à unidade para vacinação.",["A equipe de saúde recomendou as famílias que levassem as crianças a unidade para vacinação.","A equipe de saúde recomendou à famílias que levassem as crianças à unidade para vacinação.","A equipe de saúde recomendou às famílias que levassem as crianças à unidade à partir de segunda."],"'Às famílias' e 'à unidade' levam crase (preposição + artigo). Não há crase antes de 'partir' nem antes de plural sem artigo ('à famílias')."],
[M,"Uma equipe de saúde da família acompanha 1.200 famílias. Na primeira semana do mês, os agentes visitaram 15% delas. Na segunda semana, visitaram 25% das famílias que ainda não tinham sido visitadas. Ao final das duas semanas, o total de famílias visitadas foi de:","435",["300","480","375"],"15% de 1.200 = 180. Restam 1.020; 25% de 1.020 = 255. Total: 180 + 255 = 435."],
[M,"Uma unidade de saúde consome 3 litros de álcool em gel a cada 5 dias. Mantido o mesmo ritmo de consumo, a quantidade necessária para 30 dias é de:","18 litros",["15 litros","20 litros","9 litros"],"30 dias equivalem a 6 períodos de 5 dias; 6 × 3 = 18 litros."],
[E,"Sobre os princípios e diretrizes do Sistema Único de Saúde (SUS), analise as afirmativas a seguir.\n\nI. A universalidade garante a todos os cidadãos o acesso às ações e aos serviços de saúde.\nII. A equidade propõe tratar todas as pessoas de forma idêntica, sem considerar as diferenças de necessidade.\nIII. A participação da comunidade na gestão do SUS é exercida por meio dos Conselhos e das Conferências de Saúde.\n\nEstá(ão) correta(s):","Apenas I e III.",["Apenas I.","Apenas II.","Apenas I e III.","I, II e III."],"A equidade trata de forma desigual os desiguais, priorizando quem mais precisa; por isso a afirmativa II é falsa.",1],
[E,"Em uma reunião do Conselho Municipal de Saúde, representantes dos usuários, dos trabalhadores e dos gestores discutiram o plano municipal de saúde. Esse espaço de participação, previsto na Lei nº 8.142/1990, caracteriza-se por ser:","permanente e deliberativo, com os usuários representando metade dos membros.",["temporário e apenas consultivo, sem poder de decisão.","exclusivo de gestores e prestadores de serviço.","privado e dependente de autorização judicial."],"O Conselho de Saúde é órgão colegiado permanente e deliberativo, com composição paritária (50% de usuários)."],
[E,"Maria procura a unidade básica de saúde com febre persistente. A equipe a avalia, resolve o caso e, quando necessário, a encaminha a outro ponto da rede, mantendo o acompanhamento. Segundo a PNAB (Portaria nº 2.436/2017), esse exemplo ilustra a função de:","coordenar o cuidado e ordenar a rede de atenção à saúde.",["atender apenas casos de urgência hospitalar.","oferecer cuidado fragmentado, sem vínculo com o usuário.","substituir os demais pontos da rede de atenção."],"A APS é a porta de entrada preferencial, coordena o cuidado e ordena o acesso à rede."],
[E,"Em relação às atividades do agente comunitário de saúde (Lei nº 11.350/2006), analise as afirmativas a seguir.\n\nI. O ACS deve residir na área da comunidade em que atuar.\nII. Cabe ao ACS prescrever medicamentos aos moradores da microárea.\nIII. O ACS realiza visitas domiciliares e orienta sobre a prevenção de doenças e a promoção da saúde.\n\nEstá(ão) correta(s):","Apenas I e III.",["Apenas I.","Apenas II e III.","Apenas I e III.","I, II e III."],"Prescrever medicamentos não é atribuição do ACS; a afirmativa II é falsa.",1],
[E,"Ao iniciar o trabalho em uma microárea, o agente comunitário de saúde percorre as ruas, identifica as famílias, registra as moradias, as condições de saneamento e os grupos prioritários (gestantes, crianças, idosos e pessoas com doenças crônicas). Essa atividade corresponde, principalmente, ao:","cadastramento das famílias e ao mapeamento do território.",["tratamento clínico das doenças identificadas.","procedimento de aplicação de vacinas.","processo de emissão de atestados médicos."],"O cadastro e o mapeamento orientam o planejamento das ações da equipe."],
[E,"Durante uma visita domiciliar, o ACS identifica um morador com sintomas de doença de notificação compulsória. A conduta mais adequada é:","comunicar imediatamente a equipe de saúde, para que a notificação e as medidas de vigilância sejam realizadas.",["aguardar que o morador procure a unidade por conta própria.","orientar que ele não procure atendimento para evitar exames.","divulgar o caso entre os vizinhos para alertar a comunidade."],"A notificação é obrigatória e permite à vigilância agir rapidamente, respeitando o sigilo."],
 
// ---- Simulado 02: imunização, atribuições e doenças
[P,"Leia o texto a seguir.\n\nA vacinação é uma das medidas de saúde pública de melhor custo-benefício. Doenças como a poliomielite e o sarampo foram controladas graças à imunização em massa. No entanto, a queda nas coberturas vacinais, impulsionada pela desinformação, ameaça esses avanços e permite o retorno de doenças que já estavam sob controle.\n\nSegundo o texto, a queda nas coberturas vacinais:","pode provocar o retorno de doenças que já estavam controladas.",["é consequência do controle completo das doenças.","resulta do excesso de informação científica.","não interfere na saúde coletiva."],"O texto afirma que a queda 'permite o retorno de doenças que já estavam sob controle'."],
[P,"Assinale a alternativa em que a concordância verbal está de acordo com a norma-padrão:","Devem ser realizadas visitas domiciliares semanais às famílias de risco.",["Deve ser realizado visitas domiciliares semanais às famílias de risco.","Haviam famílias em situação de risco na microárea.","Fazem dois meses que o agente iniciou o cadastramento."],"O verbo acompanha o sujeito 'visitas' (plural). 'Haver' (existir) e 'fazer' (tempo) são impessoais."],
[M,"Uma campanha de vacinação atendeu 840 crianças em 7 dias, com o mesmo número de atendimentos por dia. Mantido esse ritmo, o número de crianças atendidas em 12 dias será de:","1.440",["1.260","1.200","1.680"],"840 ÷ 7 = 120 por dia; 120 × 12 = 1.440."],
[M,"Um agente comunitário registrou o número de visitas realizadas em cinco dias: 12, 15, 9, 15 e 14. A média, a mediana e a moda desse conjunto são, respectivamente:","13, 14 e 15.",["13, 15 e 14.","14, 13 e 15.","13, 12 e 15."],"Soma = 65, média = 13. Ordenando: 9, 12, 14, 15, 15; a mediana é 14 e a moda é 15."],
[E,"Em uma unidade de saúde, a geladeira de vacinas ficou desligada durante a noite e a temperatura saiu da faixa de +2 °C a +8 °C. Quanto à conservação dos imunobiológicos (cadeia de frio), a conduta correta é:","isolar os imunobiológicos, comunicar a coordenação e aguardar avaliação técnica antes de qualquer uso.",["usar normalmente, pois a variação é irrelevante.","descartar tudo sem registrar a ocorrência.","congelar as vacinas para preservá-las."],"Variações de temperatura podem comprometer a eficácia; a decisão é técnica e deve ser registrada."],
[E,"Sobre o aleitamento materno e a alimentação complementar, analise as afirmativas a seguir.\n\nI. Até os seis meses de idade, o bebê deve receber leite materno exclusivo.\nII. A partir dos seis meses, inicia-se a alimentação complementar, mantendo-se o leite materno.\nIII. Água e chás devem ser oferecidos desde o primeiro mês para evitar cólicas.\n\nEstá(ão) correta(s):","Apenas I e II.",["Apenas I.","Apenas II e III.","Apenas I e II.","I, II e III."],"Antes dos seis meses, o leite materno exclusivo supre as necessidades do bebê, inclusive de líquidos.",1],
[E,"Joana, de 22 anos, está grávida de 10 semanas e ainda não iniciou o pré-natal, pois acredita que só precisa consultar perto do parto. A orientação mais adequada do agente comunitário de saúde é:","explicar a importância do início precoce do pré-natal e ajudar a agendar a primeira consulta na unidade.",["concordar e aguardar o final da gestação.","sugerir que ela use vitaminas por conta própria.","orientar que procure atendimento apenas se sentir dor."],"O pré-natal precoce reduz riscos para a mãe e para o bebê."],
[E,"Sobre a dengue, analise as afirmativas a seguir.\n\nI. A eliminação de água parada é a principal medida de prevenção.\nII. Dor abdominal intensa e vômitos persistentes são sinais de alarme.\nIII. O ácido acetilsalicílico (AAS) é recomendado para baixar a febre.\n\nEstá(ão) correta(s):","Apenas I e II.",["Apenas I.","Apenas II e III.","Apenas I e II.","I, II e III."],"O AAS é contraindicado na suspeita de dengue, pelo risco de sangramento.",1],
[E,"Em visita domiciliar, o ACS encontra um morador com tosse há mais de três semanas, febre no fim da tarde e emagrecimento. A conduta adequada é:","encaminhá-lo à unidade de saúde para investigação de tuberculose e comunicar a equipe.",["orientar apenas o uso de xarope caseiro.","aguardar a tosse passar espontaneamente.","dizer que se trata de alergia e dispensar a avaliação."],"Tosse por três semanas ou mais caracteriza o sintomático respiratório."],
[E,"Em uma ação educativa, um participante afirma que o HIV pode ser transmitido por abraço e pelo uso do mesmo copo. A resposta correta do ACS é:","o HIV não se transmite por contato social casual; a transmissão ocorre por sangue, relação sexual sem proteção e de mãe para filho.",["isso está correto, por isso é preciso evitar contato com pessoas com HIV.","a transmissão ocorre por picada de mosquito e por tosse.","a transmissão ocorre somente em hospitais."],"Combater o estigma faz parte da educação em saúde."],
 
// ---- Simulado 03: saneamento, saúde mental, crônicas, ética e educação em saúde
[P,"Leia o texto a seguir.\n\nEm muitos bairros, o descarte inadequado de lixo favorece a proliferação de ratos e mosquitos. A coleta seletiva e a destinação correta dos resíduos reduzem a poluição e previnem doenças. Cabe a cada morador colaborar, mas o poder público tem o dever de garantir o serviço de coleta e o saneamento básico.\n\nO texto defende que:","moradores e poder público têm responsabilidades na gestão dos resíduos e na prevenção de doenças.",["somente os moradores são responsáveis pelo lixo.","a coleta seletiva aumenta a poluição.","o saneamento básico é dispensável."],"O texto divide a responsabilidade entre moradores e poder público."],
[P,"Assinale a alternativa em que a pontuação está de acordo com a norma-padrão:","Os agentes, que conhecem bem a comunidade, orientaram as famílias.",["Os agentes que, conhecem bem a comunidade orientaram as famílias.","Os agentes, que conhecem bem a comunidade orientaram, as famílias.","Os agentes que conhecem bem, a comunidade, orientaram as famílias."],"A oração explicativa 'que conhecem bem a comunidade' fica entre vírgulas."],
[M,"Uma caixa d'água tem formato de paralelepípedo, com 2 m de comprimento, 1,5 m de largura e 1 m de altura. Quando totalmente cheia, ela comporta:","3.000 litros.",["300 litros.","30.000 litros.","4.500 litros."],"V = 2 × 1,5 × 1 = 3 m³, e 1 m³ equivale a 1.000 litros."],
[M,"Para tratar a água de um tambor, um agente orienta o uso de 2 gotas de hipoclorito para cada litro. Para um tambor com 200 litros, serão necessárias:","400 gotas.",["100 gotas.","200 gotas.","40 gotas."],"2 gotas × 200 litros = 400 gotas."],
[E,"Sobre o consumo e o armazenamento de água, analise as afirmativas a seguir.\n\nI. A água de consumo deve ser filtrada, fervida ou tratada com hipoclorito, conforme a orientação.\nII. As caixas d'água devem permanecer tampadas e ser limpas periodicamente.\nIII. Pode-se beber água de poço desprotegido, pois ela é sempre potável.\n\nEstá(ão) correta(s):","Apenas I e II.",["Apenas I.","Apenas II e III.","Apenas I e II.","I, II e III."],"Água de fonte desprotegida pode estar contaminada, por isso a afirmativa III é falsa.",1],
[E,"Um idoso viúvo, que antes participava de atividades no bairro, passou a isolar-se, relata cansaço constante e diz que \"não faz mais sentido viver\". A atitude mais adequada do ACS é:","acolher e escutar sem julgamento, considerar o relato um sinal de alerta e comunicar imediatamente a equipe para avaliação e encaminhamento.",["dizer que isso é frescura e que logo passa.","prometer manter o relato em segredo absoluto.","aguardar a melhora espontânea sem comunicar ninguém."],"Sinais de risco de suicídio exigem acolhimento e encaminhamento rápidos."],
[E,"Sobre a Rede de Atenção Psicossocial (RAPS), é correto afirmar que:","os Centros de Atenção Psicossocial (CAPS) oferecem cuidado comunitário a pessoas com sofrimento mental intenso.",["o CAPS é hospital psiquiátrico de internação de longa permanência.","o CAPS atende apenas mediante ordem judicial.","a RAPS exclui a Atenção Básica."],"O modelo é comunitário e em liberdade, articulado com a Atenção Básica."],
[E,"O senhor Antônio, de 62 anos e hipertenso, parou de tomar o medicamento porque \"a pressão normalizou\". A orientação mais adequada do ACS é:","explicar que a pressão controlada resulta do tratamento, orientar a continuidade do uso e avisar a equipe para reavaliação.",["concordar, pois a pressão normalizada dispensa o remédio.","sugerir dobrar a dose quando sentir mal-estar.","orientar a trocar o remédio por chás."],"A adesão ao tratamento previne complicações como AVC e infarto."],
[E,"Em uma visita, o ACS toma conhecimento de que um vizinho tem uma doença. Outro morador pergunta sobre a saúde desse vizinho. A conduta ética é:","manter o sigilo das informações obtidas no exercício da função, compartilhando-as apenas com a equipe, quando necessário.",["contar tudo, pois a comunidade tem direito à informação.","comentar apenas com os amigos mais próximos.","divulgar nas redes sociais para alertar a vizinhança."],"O sigilo é dever ético e protege a dignidade das pessoas."],
[E,"Para uma ação educativa sobre a prevenção da dengue na comunidade, a estratégia mais adequada é:","planejar a atividade com linguagem acessível, mobilizar moradores e lideranças e dialogar a partir da realidade do território.",["apenas distribuir folhetos, sem conversar com os moradores.","realizar palestra técnica com linguagem difícil.","culpar os moradores pelos casos da doença."],"A educação em saúde é participativa e considera o contexto local."],
 
// ---- Simulado 04: epidemiologia, vigilância e doenças transmitidas por vetores
[P,"Leia o trecho a seguir.\n\n'A dengue não escolhe endereço: bate à porta de ricos e pobres, à procura de água parada.'\n\nNesse trecho, a expressão 'bate à porta' constitui exemplo de:","personificação (prosopopeia), pois atribui uma ação humana à doença.",["hipérbole, pois exagera a gravidade da doença.","ironia, pois expressa o contrário do que se quer dizer.","antítese, pois aproxima ideias opostas."],"Atribuir ao fenômeno uma ação própria de pessoas (bater à porta) é personificação."],
[P,"Em 'A vacina é gratuita; no entanto, muitos moradores não a procuram', o conectivo 'no entanto' pode ser substituído, sem alteração do sentido, por:","contudo.",["portanto.","porque.","logo."],"'No entanto' e 'contudo' são conjunções adversativas (oposição); as demais indicam conclusão ou causa."],
[M,"O número de casos de uma doença em um bairro, em função do tempo t (em semanas), é dado por C(t) = t² − 8t + 15. O número de casos é igual a zero nas semanas:","3 e 5.",["2 e 6.","1 e 15.","4 e 4."],"Soma das raízes = 8 e produto = 15, logo t = 3 e t = 5."],
[M,"Cinco agentes visitam 100 domicílios em 4 dias. Mantido o mesmo ritmo por agente, o número de domicílios visitados por 8 agentes em 5 dias é de:","200.",["160.","250.","125."],"Cada agente visita 5 domicílios por dia (100 ÷ 20). Então 8 × 5 × 5 = 200."],
[E,"Sobre noções de epidemiologia, analise as afirmativas a seguir.\n\nI. Hospedeiro é o organismo que alberga o agente infeccioso.\nII. Vetor é o animal que transmite o agente infeccioso de um hospedeiro a outro.\nIII. Período de incubação é o tempo entre o início dos sintomas e a cura.\n\nEstá(ão) correta(s):","Apenas I e II.",["Apenas I.","Apenas II e III.","Apenas I e II.","I, II e III."],"Período de incubação é o intervalo entre a exposição ao agente e o aparecimento dos primeiros sintomas.",1],
[E,"Em uma indústria da região, vários trabalhadores apresentaram intoxicação pelo contato com um produto químico. A vigilância que deve investigar as condições do ambiente e dos processos de trabalho, para identificar e reduzir os riscos, é a vigilância em:","saúde do trabalhador.",["nutrição, apenas.","zoonoses, exclusivamente.","fronteiras e portos, apenas."],"A vigilância em saúde do trabalhador atua sobre a relação entre trabalho e saúde."],
[E,"O ACS registra, em cada visita, os dados das famílias no sistema e-SUS da Atenção Primária. Sobre esse registro, é correto afirmar que:","as informações devem ser fiéis à realidade e tratadas com sigilo, pois subsidiam o planejamento e a vigilância em saúde.",["os dados podem ser preenchidos de forma aproximada, sem conferência.","as informações podem ser divulgadas livremente à comunidade.","o registro é opcional e não interfere no planejamento."],"Dados corretos permitem diagnosticar o território e orientar as ações da equipe."],

[P,"Assinale a grafia correta:","hipertensão",["hipertenção","ipertensão","hipertensaõ"],"A palavra deriva de 'tensão', com 's' e 'ão'."],

[M,"Um produto de R$ 150 recebe desconto de 20%. O novo preço é:","R$ 120",["R$ 130","R$ 110","R$ 100"],"20% de 150 = 30; 150 − 30 = 120."],
[E,"Em caso de mordedura por animal suspeito de raiva, o primeiro cuidado é:","Lavar o ferimento com água corrente e sabão e procurar a unidade de saúde",["Apenas passar álcool","Fechar o ferimento com curativo apertado","Aguardar sem fazer nada"],"A avaliação decide sobre soro e vacina antirrábica."],

[P,"Assinale a palavra com acentuação correta:","farmácia",["farmacia","fármacia","farmácía"],"É paroxítona terminada em ditongo, e por isso leva acento."],

[M,"Sendo f(x) = 2x + 3, o valor de f(4) é:","11",["8","14","9"],"2 × 4 + 3 = 11."],
[E,"A vacina contra o HPV é indicada principalmente para:","Crianças e adolescentes, antes do início da vida sexual",["Somente idosos","Apenas gestantes","Somente quem já tem verrugas"],"Previne cânceres e verrugas associados ao vírus, como o de colo do útero."],

{
  tema:"rosa", cargo:"Técnico de Enfermagem", banca:"GL Consultoria", nome:"Questões extensas (estilo prova)", size:10,
  titles:["Segurança do Paciente, Sinais Vitais, Medicação e Procedimentos", "IRAS, Biossegurança, CME, Úlceras por Pressão e Curativos", "Urgência, Cirurgia Segura, Saúde Pública e Ética"],
  bank:[
// ---- Simulado 01: segurança do paciente, sinais vitais, medicação e procedimentos
[P,"Leia o texto a seguir.\n\nA segurança do paciente é um princípio central da assistência de enfermagem. Erros de medicação, quedas e infecções são eventos evitáveis quando a equipe segue protocolos, confere prescrições e registra corretamente os cuidados prestados. Por isso, a comunicação clara entre os profissionais é tão importante quanto a habilidade técnica.\n\nDe acordo com o texto, os eventos evitáveis podem ser prevenidos quando:","a equipe segue protocolos, confere prescrições e registra os cuidados prestados.",["o paciente evita procurar atendimento.","a habilidade técnica dispensa a comunicação.","os registros são feitos somente ao final do mês."],"As condições estão explícitas no segundo período do texto."],
[P,"Assinale a alternativa em que a concordância está de acordo com a norma-padrão:","Foram administrados os medicamentos prescritos ao paciente no horário correto.",["Foi administrado os medicamentos prescritos ao paciente no horário correto.","Fazem três horas que o paciente recebeu a medicação.","Existe vários pacientes aguardando atendimento na recepção."],"O verbo concorda com o sujeito 'medicamentos' (plural). 'Fazer' (tempo) é impessoal e 'existir' concorda com 'pacientes'."],
[M,"A prescrição médica é de 750 mg de um antibiótico por via endovenosa. O frasco-ampola disponível contém 1 g (1.000 mg) diluído em 10 mL. O volume a ser aspirado é de:","7,5 mL.",["5 mL.","7 mL.","8,5 mL."],"750 ÷ 1.000 × 10 = 7,5 mL."],
[M,"Foram prescritos 500 mL de soro fisiológico em 4 horas, em equipo de macrogotas (20 gotas = 1 mL). O gotejamento, em gotas por minuto, é de aproximadamente:","42.",["21.","83.","125."],"500 × 20 = 10.000 gotas em 240 minutos; 10.000 ÷ 240 ≈ 42 gotas/min."],
[E,"Sobre os sinais vitais, analise as afirmativas a seguir.\n\nI. A frequência cardíaca normal do adulto em repouso varia, em geral, de 60 a 100 batimentos por minuto.\nII. A frequência respiratória normal do adulto em repouso é, em geral, de 12 a 20 incursões por minuto.\nIII. Uma saturação periférica de oxigênio de 85% em ar ambiente é considerada normal.\n\nEstá(ão) correta(s):","Apenas I e II.",["Apenas I.","Apenas II e III.","Apenas I e II.","I, II e III."],"A SpO₂ normal em ar ambiente é, em geral, igual ou superior a 95%; 85% indica hipoxemia.",1],
[E,"Ao preparar uma medicação, o técnico de enfermagem percebe que o nome do paciente na pulseira de identificação é diferente do nome registrado na prescrição. A conduta correta é:","não administrar, confirmar a identificação com a equipe e esclarecer com o enfermeiro ou prescritor antes de prosseguir.",["administrar a medicação mesmo assim, para não atrasar o horário.","confirmar apenas com o acompanhante e administrar.","corrigir o nome na prescrição por conta própria."],"A identificação correta do paciente é uma das metas internacionais de segurança."],
[E,"O técnico de enfermagem precisa aplicar uma injeção intramuscular em um paciente adulto. Entre as regiões a seguir, a que oferece menor risco de lesão de nervos e vasos calibrosos é a:","região ventroglútea.",["região dorsoglútea.","face posterior do braço.","região plantar."],"A região ventroglútea (de Hochstetter) é considerada a mais segura para adultos."],
[E,"Durante a infusão venosa periférica, o paciente refere dor e apresenta vermelhidão e edema no local da punção. A conduta adequada é:","interromper a infusão, comunicar o enfermeiro, registrar e avaliar a retirada do acesso conforme o protocolo.",["aumentar o gotejamento para finalizar a infusão.","massagear o local com força.","manter a infusão e ignorar os sinais."],"Os sinais sugerem flebite ou infiltração, que exigem avaliação imediata."],
[E,"Sobre a administração de dieta enteral por sonda, analise as afirmativas a seguir.\n\nI. A dieta pode ser infundida com o paciente deitado reto, para maior conforto.\nII. A posição da sonda deve ser verificada conforme o protocolo antes de iniciar a dieta.\nIII. Após a administração, a sonda deve ser lavada conforme o protocolo, para evitar obstrução.\n\nEstá(ão) correta(s):","Apenas II e III.",["Apenas I.","Apenas II e III.","Apenas I e III.","I, II e III."],"A cabeceira deve permanecer elevada (30° a 45°) para reduzir o risco de aspiração.",1],
[E,"Um paciente está em uso de sonda vesical de demora. Entre as medidas para reduzir o risco de infecção do trato urinário, destaca-se:","manter o sistema fechado e a bolsa coletora abaixo do nível da bexiga, sem contato com o chão.",["desconectar a bolsa sempre que for esvaziá-la.","apoiar a bolsa sobre o abdome do paciente.","trocar a sonda todos os dias, sem indicação."],"Evita-se contaminação e refluxo de urina para a bexiga."],
 
// ---- Simulado 02: IRAS, biossegurança, CME, úlceras por pressão e curativos
[P,"Leia o texto a seguir.\n\nA higienização das mãos é considerada a medida mais simples e eficaz para prevenir infecções relacionadas à assistência à saúde. Mesmo assim, a adesão dos profissionais ainda é inferior ao desejado, o que exige campanhas educativas e a disponibilização de insumos, como sabonete líquido e preparações alcoólicas, em pontos estratégicos.\n\nSegundo o texto, para melhorar a adesão à higienização das mãos são necessárias:","campanhas educativas e oferta de insumos em pontos estratégicos.",["a redução do número de profissionais.","a proibição do uso de preparações alcoólicas.","a retirada dos lavatórios dos setores."],"As duas medidas são citadas no último trecho do texto."],
[P,"Assinale a alternativa em que o emprego do sinal indicativo de crase está de acordo com a norma-padrão:","O técnico entregou o relatório à enfermeira responsável pelo plantão.",["Os pacientes chegaram à pé ao hospital.","O técnico referiu-se à todos os pacientes internados.","A visita começa à partir das 14 horas."],"'À enfermeira' = preposição a + artigo a. Não há crase antes de palavra masculina, pronome indefinido ou verbo ('à partir')."],
[M,"O consumo mensal de luvas de procedimento de um setor era de 400 caixas e aumentou 15%. O novo consumo mensal é de:","460 caixas.",["415 caixas.","455 caixas.","600 caixas."],"15% de 400 = 60; 400 + 60 = 460."],
[M,"Os tempos de espera, em minutos, de cinco pacientes foram: 10, 25, 15, 25 e 20. A média, a mediana e a moda são, respectivamente:","19, 20 e 25.",["19, 25 e 20.","20, 19 e 25.","19, 15 e 25."],"Soma = 95, média = 19. Ordenando: 10, 15, 20, 25, 25; mediana 20; moda 25."],
[E,"Sobre a prevenção de infecções relacionadas à assistência à saúde (IRAS), analise as afirmativas a seguir.\n\nI. A higienização das mãos é a principal medida de prevenção das IRAS.\nII. O uso de luvas substitui a higienização das mãos.\nIII. As mãos devem ser higienizadas antes e após o contato com o paciente.\n\nEstá(ão) correta(s):","Apenas I e III.",["Apenas I.","Apenas II e III.","Apenas I e III.","I, II e III."],"As luvas não dispensam a higienização das mãos antes e depois do uso.",1],
[E,"Ao realizar um procedimento, um técnico de enfermagem se fere com uma agulha usada em paciente de sorologia desconhecida. As condutas imediatas corretas são:","lavar o local com água e sabão, comunicar a chefia e procurar o serviço de referência para avaliação e profilaxia, com notificação do acidente.",["espremer o local e continuar o plantão sem relatar.","apenas fazer um curativo e aguardar sintomas.","aplicar álcool e ignorar o ocorrido."],"A avaliação precoce aumenta a eficácia da profilaxia pós-exposição (NR-32)."],
[E,"Antes de realizar a aspiração de vias aéreas em um paciente com secreção abundante, o técnico de enfermagem deve utilizar, de acordo com a biossegurança:","luvas, avental, máscara e óculos de proteção ou protetor facial.",["apenas luvas.","apenas touca.","somente máscara."],"O conjunto protege contra respingos de secreções e outros fluidos."],
[E,"Sobre a Central de Material e Esterilização (CME), analise as afirmativas a seguir.\n\nI. O fluxo de trabalho pode ser livre, sem separação entre áreas suja e limpa.\nII. O indicador biológico é o que oferece maior segurança no monitoramento da esterilização.\nIII. A autoclave esteriliza materiais por meio de vapor saturado sob pressão.\n\nEstá(ão) correta(s):","Apenas II e III.",["Apenas I.","Apenas II e III.","Apenas I e III.","I, II e III."],"A RDC nº 15/2012 exige fluxo unidirecional, da área suja para a limpa.",1],
[E,"Um paciente acamado há 10 dias apresenta, na região sacral, área avermelhada que não empalidece à pressão, com pele íntegra. Esse achado é compatível com úlcera por pressão em estágio 1. A conduta adequada do técnico é:","comunicar o enfermeiro, aliviar a pressão por meio da mudança de decúbito e manter a pele limpa e hidratada.",["massagear vigorosamente a área.","manter o paciente na mesma posição.","aplicar calor local intenso."],"A intervenção precoce evita a progressão para estágios mais graves."],
[E,"Na realização de curativo em ferida operatória limpa, o técnico de enfermagem deve:","higienizar as mãos, usar técnica asséptica, limpar da incisão para a periferia e registrar o aspecto da ferida.",["limpar da periferia para a incisão com a mesma gaze.","reutilizar materiais de outro paciente.","dispensar o uso de luvas."],"Limpa-se da área menos contaminada para a mais contaminada."],
 
// ---- Simulado 03: urgência, cirurgia, saúde pública e ética
[P,"Leia o texto a seguir.\n\nNas situações de urgência, a rapidez do atendimento pode determinar a sobrevida do paciente. Por isso, a equipe deve reconhecer precocemente os sinais de gravidade, acionar o serviço especializado e iniciar as manobras de suporte básico enquanto aguarda a chegada do socorro, sempre priorizando a segurança da cena.\n\nDe acordo com o texto, durante a espera pelo socorro especializado, a equipe deve:","iniciar as manobras de suporte básico, priorizando a segurança da cena.",["aguardar passivamente, sem nenhuma ação.","evitar acionar o serviço especializado.","ignorar os sinais de gravidade."],"A orientação aparece no final do trecho."],
[P,"Assinale a alternativa em que a pontuação está de acordo com a norma-padrão:","O paciente, que estava inconsciente, foi levado imediatamente à sala de emergência.",["O paciente que, estava inconsciente foi levado imediatamente à sala de emergência.","O paciente, que estava inconsciente foi levado, imediatamente à sala de emergência.","O paciente que estava inconsciente, foi levado imediatamente, à sala de emergência."],"A oração explicativa fica entre vírgulas; não se separa sujeito de verbo."],
[M,"Uma rampa de 5 m de comprimento termina em uma plataforma situada a 3 m de distância horizontal do início da rampa. A altura da plataforma é de:","4 m.",["2 m.","3 m.","5 m."],"Pitágoras: 5² = 3² + h², logo h² = 16 e h = 4."],
[M,"Em um plantão, 6 técnicos realizam 90 curativos em 5 horas, no mesmo ritmo. Mantido esse ritmo por técnico, o número de curativos realizados por 9 técnicos em 4 horas é de:","108.",["120.","96.","135."],"Cada técnico faz 3 curativos por hora (90 ÷ 30). Então 9 × 4 × 3 = 108."],
[E,"Sobre a ressuscitação cardiopulmonar (RCP) em adultos, analise as afirmativas a seguir.\n\nI. Recomenda-se realizar compressões torácicas em frequência de 100 a 120 por minuto.\nII. A profundidade recomendada é de, aproximadamente, 5 cm, sem exceder 6 cm.\nIII. Deve-se interromper as compressões por vários minutos para verificar o pulso.\n\nEstá(ão) correta(s):","Apenas I e II.",["Apenas I.","Apenas II e III.","Apenas I e II.","I, II e III."],"As interrupções devem ser mínimas, e o tórax deve retornar completamente entre as compressões.",1],
[E,"Um paciente apresenta crise convulsiva generalizada. A conduta adequada da equipe é:","proteger a cabeça, afastar objetos, não conter os movimentos nem colocar nada na boca, posicionar em decúbito lateral após a crise e registrar a duração e as características.",["segurar o paciente com força para interromper a crise.","colocar um objeto na boca para evitar mordedura da língua.","oferecer água durante a crise."],"A prioridade é evitar traumas e proteger as vias aéreas."],
[E,"Um paciente de 68 anos apresenta, de início súbito, desvio da rima labial, fraqueza no braço direito e dificuldade para falar. A conduta inicial mais adequada é:","acionar imediatamente o serviço de urgência (SAMU 192), registrar o horário de início dos sintomas e manter o paciente em observação.",["orientar o paciente a repousar e observar por 24 horas.","oferecer alimentos e líquidos para recuperar a força.","aguardar o dia seguinte para agendar consulta."],"Os sinais sugerem AVC, e o tempo até o tratamento é decisivo."],
[E,"Sobre o protocolo de cirurgia segura e o pós-operatório, analise as afirmativas a seguir.\n\nI. O checklist de cirurgia segura deve ser aplicado apenas ao final do procedimento.\nII. No pós-operatório imediato, devem ser monitorados sinais vitais, nível de consciência, dor e sangramentos.\nIII. Drenos e curativos devem ser observados quanto à permeabilidade e a sinais de sangramento.\n\nEstá(ão) correta(s):","Apenas II e III.",["Apenas I.","Apenas II e III.","Apenas I e III.","I, II e III."],"O checklist é aplicado antes da indução anestésica, antes da incisão e antes de o paciente deixar a sala.",1],
[E,"Durante o atendimento, o técnico de enfermagem suspeita de maus-tratos em uma criança com lesões sem explicação plausível. De acordo com o ECA, a conduta adequada é:","comunicar a equipe e o Conselho Tutelar, e registrar os achados de forma objetiva.",["aguardar a confirmação por perícia para comunicar.","orientar a família a não procurar mais o serviço.","manter o caso em segredo da equipe."],"A comunicação da suspeita é obrigatória."],
[E,"O técnico de enfermagem percebe que um colega registrou no prontuário um procedimento que não executou. Com base no Código de Ética dos Profissionais de Enfermagem (Resolução COFEN nº 564/2017), a conduta correta é:","não compactuar, comunicar o enfermeiro responsável ou a chefia e zelar pela veracidade dos registros.",["omitir o fato para proteger o colega.","fazer o mesmo registro para manter a harmonia da equipe.","ignorar, pois o registro não tem valor legal."],"O prontuário é documento legal, e o registro deve ser fiel."]
]
},

  bank:[

[P,"Em 'Vacine-se hoje!', predomina a função da linguagem:","Conativa (apelativa)",["Referencial","Emotiva","Poética"],"O texto procura levar o leitor a agir, característica da função conativa."],
[P,"Em 'Estou morrendo de fome', há a figura de linguagem:","Hipérbole",["Metáfora","Eufemismo","Ironia"],"A hipérbole exagera a ideia para dar ênfase."],
[M,"Um capital de R$ 1.000 aplicado a juros simples de 2% ao mês durante 5 meses rende de juros:","R$ 100",["R$ 10","R$ 110","R$ 200"],"J = C × i × t = 1.000 × 0,02 × 5 = 100."],

[E,"A frequência respiratória normal de um adulto em repouso é de:","12 a 20 incursões por minuto",["6 a 10","25 a 35","40 a 60"],"Acima de 20 é taquipneia; abaixo de 12, bradipneia."],

[E,"A antissepsia é:","O uso de antissépticos na pele ou mucosas para reduzir microrganismos",["A esterilização de instrumentos cirúrgicos","A limpeza do piso","O uso de EPIs"],"Aplica-se a tecidos vivos; a esterilização se aplica a artigos."],
[E,"A higienização das mãos com água e sabão deve durar:","De 40 a 60 segundos",["5 a 10 segundos","10 a 15 segundos","2 a 3 minutos"],"Com preparação alcoólica, a fricção dura de 20 a 30 segundos."],
[E,"Para aferir o peso de um paciente adulto em balança, deve-se:","Usar balança calibrada e zerada, com o paciente de roupas leves e sem calçados",["Pesar com casaco e sapatos","Usar balança sem zerar","Estimar visualmente"],"Garante precisão, importante para cálculo de doses."],

[P,"Um folheto que ensina como prevenir a dengue é um texto predominantemente:","Injuntivo (instrucional)",["Narrativo","Poético","Descritivo"],"Orienta e instrui o leitor sobre como agir."],
[P,"A palavra 'infelizmente' é formada por:","Derivação prefixal e sufixal",["Composição por justaposição","Composição por aglutinação","Onomatopeia"],"in- (prefixo) + feliz + -mente (sufixo)."],
[M,"Se 3 agentes visitam 90 casas em 5 dias, 6 agentes visitam 180 casas em:","5 dias",["10 dias","2,5 dias","6 dias"],"Regra de três composta: dobrando agentes e casas, o prazo se mantém."],

// Para adicionar questões, acrescente itens ao final de 'bank' do módulo desejado (múltiplo de 'size').
// Formato: [categoria, enunciado, certa, [erradas], explicação] (ou, com 6º item = 1: lista completa na ordem, sem embaralhar).
 
const DURATION = 50 * 60;
let mi = 0, curSim = 1, Q = [], cur = 0, answers = [], timer = null, timeLeft = DURATION;
const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const PAL = {
  cinza:   { d:"#1e293b", m:"#475569", h:"#334155", l:"#f8fafc", b:"#e2e8f0", t:"#1e293b", s:"#cbd5e1" },
  azul:    { d:"#1e3a8a", m:"#2563eb", h:"#1d4ed8", l:"#eff6ff", b:"#bfdbfe", t:"#1e40af", s:"#bfdbfe" },
  rosa:    { d:"#be185d", m:"#db2777", h:"#be185d", l:"#fdf2f8", b:"#fbcfe8", t:"#9d174d", s:"#fce7f3" },
  laranja: { d:"#c2410c", m:"#ea580c", h:"#c2410c", l:"#fff7ed", b:"#fed7aa", t:"#9a3412", s:"#ffedd5" },
  roxo:    { d:"#5b21b6", m:"#7c3aed", h:"#6d28d9", l:"#f5f3ff", b:"#ddd6fe", t:"#5b21b6", s:"#ede9fe" }
};
const vars = k => { const c = PAL[k] || PAL.cinza; return Object.keys(c).map(x => `--${x}:${c[x]}`).join(";"); };
const setTheme = k => document.documentElement.setAttribute("style", vars(k));
const nSims = m => Math.floor(m.bank.length / m.size);
function show(id) {
  ["menu", "quiz", "result"].forEach(x => $(x).classList.add("hidden"));
  $(id).classList.remove("hidden");
  $("timer-box").classList.toggle("hidden", id !== "quiz");
}
 
function home() {
  clearInterval(timer); setTheme("cinza");
  $("sub").textContent = "Escolha o cargo e o tipo de simulado";
  const groups = {};
  MODS.forEach((m, i) => { (groups[m.cargo] = groups[m.cargo] || []).push(i); });
  let h = '<h2 class="text-lg font-bold text-center mb-4">Escolha o cargo</h2><div class="space-y-4">';
  for (const c in groups) {
    const f = MODS[groups[c][0]];
    h += `<div class="border border-slate-200 rounded-xl p-4" style="${vars(f.tema)};border-left:6px solid var(--m)"><p class="text-[10px] font-bold uppercase tracking-wide th-acc">Banca ${f.banca}</p><h3 class="font-bold text-slate-900 mb-3">${c}</h3><div class="grid gap-2 sm:grid-cols-2">`;
    groups[c].forEach(i => {
      const m = MODS[i];
      h += `<button onclick="openMod(${i})" class="p-3 th-card rounded-lg text-left cursor-pointer"><span class="font-semibold th-acc block text-sm">${m.nome}</span><span class="text-xs th-acc">${nSims(m)} simulados · ${m.bank.length} questões</span></button>`;
    });
    h += "</div></div>";
  }
  $("menu-body").innerHTML = h + "</div>";
  show("menu");
}
 
function openMod(i) {
  clearInterval(timer);
  mi = i; const m = MODS[i]; setTheme(m.tema);
  $("sub").textContent = `Cargo: ${m.cargo} | Banca ${m.banca}`;
  let h = `<button onclick="home()" class="text-xs bg-slate-200 hover:bg-slate-300 px-3 py-1.5 rounded text-slate-700 font-medium cursor-pointer mb-3">← Voltar aos cargos</button>
    <p class="text-xs font-bold text-center th-acc uppercase tracking-wide mb-1">Cargo: ${m.cargo}</p>
    <h2 class="text-lg font-bold text-center mb-1">Escolha um simulado</h2>
    <p class="text-slate-600 text-sm text-center mb-5">${m.nome}. ${m.size} questões por simulado. Ao clicar na resposta, você vê na hora se acertou e a explicação.</p>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">`;
  for (let s = 1; s <= nSims(m); s++) {
    h += `<button onclick="start(${s})" class="p-4 th-card rounded-lg text-left cursor-pointer"><span class="font-bold th-acc block">Simulado ${String(s).padStart(2, "0")}</span><span class="text-xs th-acc">${m.titles[s - 1] || "Questões variadas"}</span></button>`;
  }
  h += `<button onclick="start(0)" class="p-4 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 rounded-lg text-left cursor-pointer"><span class="font-bold text-emerald-900 block">Simulado Aleatório</span><span class="text-xs text-emerald-700">${m.size} questões sorteadas deste cargo (${m.bank.length})</span></button></div>`;
  $("menu-body").innerHTML = h;
  show("menu");
}
 
function start(sim) {
  curSim = sim; const m = MODS[mi];
  const raw = sim === 0 ? shuffle(m.bank).slice(0, m.size) : m.bank.slice((sim - 1) * m.size, sim * m.size);
  Q = raw.map(r => ({
    cat: r[0], q: r[1], exp: r[4],
    opts: r[5] ? r[3].map(t => ({ t, ok: t === r[2] })) : shuffle([{ t: r[2], ok: true }, ...r[3].map(t => ({ t, ok: false }))])
  }));
  answers = Array(Q.length).fill(null); cur = 0; timeLeft = DURATION;
  $("sim-title").textContent = `${m.cargo} - ` + (sim === 0 ? "Simulado Aleatório" : `Simulado ${String(sim).padStart(2, "0")} - ${m.titles[sim - 1] || ""}`);
  show("quiz");
  clearInterval(timer); timer = setInterval(tick, 1000); tick(true);
  render();
}
 
function tick(first) {
  if (!first) timeLeft--;
  if (timeLeft <= 0) { finish(); return; }
  $("timer").textContent = `${String(Math.floor(timeLeft / 60)).padStart(2, "0")}:${String(timeLeft % 60).padStart(2, "0")}`;
}
 
function render() {
  const q = Q[cur], ans = answers[cur];
  $("tracker").textContent = `Questão ${cur + 1} de ${Q.length}`;
  $("cat").textContent = q.cat;
  $("qtext").textContent = q.q;
  $("bar").style.width = `${((cur + (ans !== null ? 1 : 0)) / Q.length) * 100}%`;
  const box = $("opts"); box.innerHTML = "";
  q.opts.forEach((o, i) => {
    const b = document.createElement("button");
    let cls = "w-full text-left p-4 rounded-lg border text-sm flex items-start gap-3 transition ";
    if (ans === null) cls += "border-slate-200 bg-white hover:bg-slate-50 cursor-pointer";
    else if (o.ok) cls += "border-emerald-500 bg-emerald-50 text-emerald-900 ring-1 ring-emerald-500";
    else if (i === ans) cls += "border-rose-500 bg-rose-50 text-rose-900 ring-1 ring-rose-500";
    else cls += "border-slate-200 bg-white opacity-60";
    b.className = cls;
    const mark = ans === null ? "" : o.ok ? " ✔" : i === ans ? " ✘" : "";
    const lt = document.createElement("span"); lt.className = "font-semibold"; lt.textContent = String.fromCharCode(65 + i) + ")";
    const tx = document.createElement("span"); tx.className = "flex-grow"; tx.textContent = o.t + mark;
    b.append(lt, tx);
    if (ans === null) b.onclick = () => { answers[cur] = i; render(); }; else b.disabled = true;
    box.appendChild(b);
  });
  const ex = $("exp");
  if (ans === null) ex.classList.add("hidden");
  else {
    const right = q.opts[ans].ok;
    ex.className = "mt-5 p-4 rounded-lg border text-sm leading-relaxed " + (right ? "bg-emerald-50 border-emerald-200 text-emerald-900" : "bg-rose-50 border-rose-200 text-rose-900");
    ex.textContent = (right ? "Correto! " : `Errado. A resposta certa é a letra ${String.fromCharCode(65 + q.opts.findIndex(o => o.ok))}. `) + q.exp;
  }
  $("prev").disabled = cur === 0;
  const last = cur === Q.length - 1, nb = $("next");
  nb.textContent = last ? "Finalizar" : "Próxima";
  nb.className = (last ? "bg-emerald-600 hover:bg-emerald-700" : "th-btn") + " text-white font-medium py-2.5 px-6 rounded-lg text-sm cursor-pointer";
}
 
function go(d) {
  if (d > 0 && cur === Q.length - 1) { finish(); return; }
  cur = Math.max(0, Math.min(Q.length - 1, cur + d)); render();
}
 
function finish() {
  clearInterval(timer); show("result");
  const hits = Q.filter((q, i) => answers[i] !== null && q.opts[answers[i]].ok).length;
  const pct = Math.round(hits / Q.length * 100);
  $("r-score").textContent = `${hits} / ${Q.length}`; $("r-pct").textContent = pct + "%";
  $("msg").textContent = pct >= 70 ? "Ótimo desempenho! Continue assim." : pct >= 50 ? "Bom caminho. Revise os erros abaixo." : "Vale revisar o conteúdo e refazer o simulado.";
  const rv = $("review"); rv.innerHTML = "";
  Q.forEach((q, i) => {
    const a = answers[i], ok = a !== null && q.opts[a].ok;
    const d = document.createElement("div");
    d.className = "p-4 rounded-lg border text-sm space-y-1 " + (ok ? "bg-emerald-50 border-emerald-200" : "bg-rose-50 border-rose-200");
    const l = ["font-semibold whitespace-pre-line", "", "", "text-slate-700"];
    const t = [`${i + 1}. ${q.q}`, "Sua resposta: " + (a === null ? "não respondida" : q.opts[a].t), "Resposta certa: " + q.opts.find(o => o.ok).t, "Explicação: " + q.exp];
    t.forEach((x, k) => { const e = document.createElement("div"); e.className = l[k]; e.textContent = x; d.appendChild(e); });
    rv.appendChild(d);
  });
}
 
home();
</script>
